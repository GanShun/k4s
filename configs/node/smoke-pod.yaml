# The M1 smoke pod.
#
# hostNetwork, deliberately: it keeps this test about the kubelet -> containerd
# -> runc path rather than about CNI. That was originally because the CNI was
# undecided; it is now simply a separation of concerns -- netns-pod.yaml is the
# pod that exercises the CNI.
#
# nodeName pins it to the node instead of going through the scheduler. The
# control plane VM has a scheduler now, so this is a leftover from when it did
# not; deploy-pod.yaml is what exercises scheduling.
#
# The container writes a marker to a hostPath so the guest can prove it ran
# without the apiserver needing to reach kubelet to fetch logs.
apiVersion: v1
kind: Pod
metadata:
  name: k4s-smoke
  namespace: default
spec:
  nodeName: k4s-node-1
  hostNetwork: true
  # Ask for a seccomp profile explicitly rather than relying on the node's
  # default, so this pod on its own asserts that the cgo-free runc compiles and
  # installs one.
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  # Always, not Never: the node is diskless, so a reboot wipes containerd's
  # state and the container kubelet knew about is gone. With Never kubelet
  # settles on ContainerStatusUnknown and does not bring it back; with Always
  # it recreates it, which is what "the workload returns" means here.
  restartPolicy: Always
  containers:
    - name: smoke
      image: docker.io/library/busybox:1.36
      # "Seccomp: 2" in /proc/self/status is SECCOMP_MODE_FILTER, i.e. the
      # process is running under a filter. The test asserts it, which is what
      # makes this an end-to-end check of the seccomp support rather than just
      # "the pod started".
      command:
        - "sh"
        - "-c"
        - "exec 2>>/out/result; echo K4S_POD_OK >> /out/result; grep '^Seccomp:' /proc/self/status >> /out/result; sleep 3600"
      volumeMounts:
        - name: out
          mountPath: /out
  volumes:
    - name: out
      hostPath:
        path: /var/log/k4s-smoke
        type: DirectoryOrCreate
