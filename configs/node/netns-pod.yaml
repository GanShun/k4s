# The pod that needs a CNI.
#
# This is the half of the networking story the smoke pod cannot tell: the smoke
# pod is hostNetwork and so never touches CNI, whereas this one asks for its own
# network namespace and therefore only runs if a CNI actually assigns it an
# address. It writes what it can see of its own interface to a hostPath, so the
# test can check the address from both ends: the apiserver's view of
# .status.podIP and the container's view of eth0.
#
# It has been both halves of that story. With only the loopback plugin on disk
# containerd refused to create the sandbox ("failed to find network info for
# sandbox ..."), because the CNI result had no address on eth0; the harness
# asserted that failure. Now that flannel is in the image this pod must run, and
# the harness asserts an address in the flannel subnet instead.
#
# nodeName pins it as with the smoke pod: the throwaway control plane has no
# scheduler.
apiVersion: v1
kind: Pod
metadata:
  name: k4s-netns
  namespace: default
spec:
  nodeName: k4s-node-1
  # Always, for the same reason as the smoke pod: a reboot wipes the runtime
  # state, and the pod object outliving it is what makes "the network comes back
  # after a reboot" a thing this test can assert.
  restartPolicy: Always
  containers:
    - name: netns
      image: docker.io/library/busybox:1.36
      command:
        - "sh"
        - "-c"
        - "exec 2>>/out/result; echo K4S_NETNS_OK >> /out/result; ip addr show eth0 | grep 'inet ' >> /out/result; sleep 3600"
      volumeMounts:
        - name: out
          mountPath: /out
  volumes:
    - name: out
      hostPath:
        path: /var/log/k4s-netns
        type: DirectoryOrCreate
