# The gate this project did not have: syntax and lint on every change, and the
# image plus a real boot when the build is cheap enough to run.
#
# `/dev/kvm` is not exposed to the runner's job pods, so the boot job runs under
# TCG: a 25 s boot, against a raised K4S_BOOT_TIMEOUT for headroom. See
# docs/testing.md for what the harness does.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages: [static, build, boot]

variables:
  DEBIAN_FRONTEND: noninteractive
  GOTOOLCHAIN: local
  GIT_DEPTH: "20"
  # DIT reuses an existing checkout as it stands, so a warm /builds is worth
  # keeping; the runner's default clean would delete every one of these.
  GIT_CLEAN_FLAGS: >-
    -ffdx -e linux/ -e build/ -e initramfs.cpio
    -e containerd/ -e coredns/ -e etcd/ -e flannel/ -e kubernetes/
    -e u-root/ -e cni-plugins/ -e flannel-cni-plugin/

.sh:
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends ca-certificates git make >/dev/null

static:
  stage: static
  extends: .sh
  interruptible: true
  script:
    - apt-get install -y -qq shellcheck >/dev/null
    - echo "== shell syntax =="
    - bash -n DIT
    - for f in scripts/*.sh; do bash -n "$f" && echo "  ok $f"; done
    - echo "== shellcheck, errors only =="
    - shellcheck -S error -x DIT scripts/*.sh && echo "  clean"

kernel:
  stage: build
  extends: .sh
  script:
    - apt-get install -y -qq --no-install-recommends
      gcc libc6-dev bc bison flex libelf-dev libssl-dev pahole cpio kmod python3 xz-utils >/dev/null
    - make kernel
  artifacts:
    paths: [build/kernel/arch/x86/boot/bzImage]
    expire_in: 1 day

initramfs:
  stage: build
  # go.work asks for 1.26.2 and containerd's main asks for 1.27.0, so the image
  # has to be at least the latter.
  image: golang:1.27-bookworm
  script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends ca-certificates git make gcc libc6-dev python3 >/dev/null
    - if [ -d ../runc/.git ]; then echo "reusing ../runc"; else
      git clone --depth 1 --branch local-main
      "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/k4s/runc.git" ../runc; fi
    - go version
    - make image
  artifacts:
    paths: [initramfs.cpio]
    expire_in: 1 day

boot:
  stage: boot
  extends: .sh
  timeout: 1h
  needs: [kernel, initramfs]
  script:
    - apt-get install -y -qq --no-install-recommends qemu-system-x86 cpio openssh-client >/dev/null
    - echo "== accelerator =="
    - if [ -w /dev/kvm ]; then echo "kvm"; else echo "tcg (no /dev/kvm in this pod)"; fi
    - mkdir -p ci-logs
    - rc=0; K4S_BOOT_TIMEOUT=900 scripts/test-boot.sh build/kernel/arch/x86/boot/bzImage initramfs.cpio || rc=$?
    - cp /tmp/k4s-boot.*.log ci-logs/ 2>/dev/null || true
    - exit $rc
  artifacts:
    when: always
    paths: [ci-logs/]
    expire_in: 1 week
