# The DNS check: a pod that resolves a Service name and then uses it.
#
# `dnsPolicy: None` with the resolver given explicitly, rather than ClusterFirst
# with kubelet's `clusterDNS`. Two reasons, and the second is the important one:
#
#   * kubelet's `clusterDNS` lives in the image, which both CNI legs share, and the
#     flannel leg has no service routing at all -- pointing ClusterFirst pods there
#     would break name resolution that works today, on a leg that cannot answer;
#   * asking the pod to use this resolver directly is a narrower claim and a
#     stronger one: `10.96.0.10` answers, it answers with a *cluster* name, and the
#     pod then uses that name to fetch a page.
#
# The name resolved is `k4s-nginx.default.svc.cluster.local`, which only exists if
# CoreDNS's kubernetes plugin is reading the apiserver: the record comes from the
# Service object, not from a hosts file.
#
# hostNetwork, like the other pods here, so the client side is not part of the
# question.
apiVersion: v1
kind: Pod
metadata:
  name: k4s-dns
  namespace: default
spec:
  nodeName: k4s-node-1
  hostNetwork: true
  restartPolicy: Always
  dnsPolicy: None
  dnsConfig:
    nameservers:
      - 10.96.0.10
    searches:
      - default.svc.cluster.local
      - svc.cluster.local
      - cluster.local
    options:
      # objects, not a "ndots:5" string: PodDNSConfigOption is a name/value pair and
      # the API server rejects a string outright.
      - name: ndots
        value: "5"
  containers:
    - name: client
      image: docker.io/library/busybox:1.36
      command:
        - "sh"
        - "-c"
        - >-
          i=0;
          while [ "$i" -lt 120 ]; do
            if nslookup k4s-nginx.default.svc.cluster.local > /out/lookup 2>&1 &&
              sed -n '/^Name:/,$p' /out/lookup | grep -q '^Address: 10\.'; then
              if wget -q -T 2 -O /out/page "http://k4s-nginx.default.svc.cluster.local/" 2>/out/error &&
                grep -q 'Welcome to nginx' /out/page; then
                echo K4S_DNS_OK > /out/result;
                exec sleep 3600;
              fi;
            fi;
            i=$((i+1));
            sleep 2;
          done;
          echo K4S_DNS_NO_ANSWER > /out/result;
          exec sleep 3600
      volumeMounts:
        - name: out
          mountPath: /out
  volumes:
    - name: out
      hostPath:
        path: /var/log/k4s-dns
        type: DirectoryOrCreate
