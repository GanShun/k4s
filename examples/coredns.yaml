# CoreDNS, from the node's own binary.
#
# `DIT` puts `coredns` in the image and nothing has ever run it, so this is also the
# first test of that binary. hostPath /bbin rather than an image: the node is
# diskless and re-pulls everything on boot, and the plugin set is whatever the
# image was built with.
#
# The `kubernetes` plugin is the part worth testing -- it answers
# `<svc>.<ns>.svc.cluster.local` from the apiserver, which means the pod needs a
# service account token and must reach the apiserver through its ClusterIP
# (`10.96.0.1`). That path only exists because Cilium replaced kube-proxy, so a
# working answer here is also evidence for the socket-level load balancer on
# cluster traffic rather than only on the pod-network one that `service: ok` covers.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k4s-coredns
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k4s-coredns
rules:
  - apiGroups: [""]
    resources: ["endpoints", "services", "pods", "namespaces"]
    verbs: ["list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k4s-coredns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k4s-coredns
subjects:
  - kind: ServiceAccount
    name: k4s-coredns
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k4s-coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health
        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
        }
        forward . /etc/resolv.conf
        cache 30
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k4s-coredns
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k4s-coredns
  template:
    metadata:
      labels:
        app: k4s-coredns
    spec:
      nodeName: k4s-node-1
      serviceAccountName: k4s-coredns
      # Default, not ClusterFirst. CoreDNS forwards to /etc/resolv.conf, and with
      # ClusterFirst that file is built from kubelet's clusterDNS -- so the day
      # clusterDNS points at this Service, CoreDNS's own upstream becomes itself and
      # every external name loops until it times out. Upstream's manifests pin this
      # for that reason.
      dnsPolicy: Default
      # On the pod network, not hostNetwork: the answer has to come back through
      # the kube-dns ClusterIP for this to be a test of the cluster's DNS path.
      containers:
        - name: coredns
          image: docker.io/library/busybox:1.36
          # The image only supplies a rootfs with a shell; the binary is the
          # node's, mounted from /bbin, and busybox's own `sh` is not used.
          command: ["/bbin/coredns", "-conf", "/etc/coredns/Corefile"]
          ports:
            - containerPort: 53
              protocol: UDP
            - containerPort: 53
              protocol: TCP
          volumeMounts:
            - name: bbin
              mountPath: /bbin
            - name: corefile
              mountPath: /etc/coredns
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 2
      volumes:
        - name: bbin
          hostPath:
            path: /bbin
            type: Directory
        - name: corefile
          configMap:
            name: k4s-coredns
---
apiVersion: v1
kind: Service
metadata:
  name: kube-dns
  namespace: kube-system
spec:
  # Fixed, because kubelet's clusterDNS has to name it and nothing here is going
  # to discover it. It is the conventional address inside the apiserver's
  # --service-cluster-ip-range (10.96.0.0/12).
  clusterIP: 10.96.0.10
  selector:
    app: k4s-coredns
  ports:
    - name: dns
      port: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      protocol: TCP
