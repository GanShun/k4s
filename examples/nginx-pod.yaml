# An off-the-shelf stateless workload: stock nginx, unmodified.
#
# The other pods here carry k4s code and write a marker. This one is a published
# image with its own entrypoint, and the only pod that has to *serve* rather than
# run, so it is verified by fetching it. There is nothing to read back, so the node
# fetches the page from the pod's address over the flannel bridge -- one assertion
# covering the registry pull, the unpack, the container start, the pod network and
# the reply.
#
# Pinned to a version tag, as the other pods here are. The digest that tag
# resolved to when this test was written was
# sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
apiVersion: v1
kind: Pod
metadata:
  name: k4s-nginx
  namespace: default
spec:
  nodeName: k4s-node-1
  # Always, as with the other pods: the node is diskless, so a reboot wipes
  # containerd's state and kubelet has to recreate the container. That the
  # workload comes back after a reboot is part of what this test asserts.
  restartPolicy: Always
  containers:
    - name: nginx
      image: docker.io/library/nginx:1.31-alpine
      # Informational. There is no kube-proxy and no service routing on this
      # node, so nothing acts on this port; it documents the intent.
      ports:
        - containerPort: 80
      # A readiness probe, so kubelet itself checks that the server answers
      # before the pod reports Ready. The harness waits for Ready as well as
      # Running, which makes "nginx is serving" something the node asserts
      # about itself rather than only something the harness observes.
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 5
