# The pod that needs a CNI.
#
# It asks for its own network namespace, so it only runs if a CNI assigns it an
# address, and it records what it sees of eth0 so the address can be checked from
# both ends: .status.podIP and the container's interface.
apiVersion: v1
kind: Pod
metadata:
  name: k4s-netns
  namespace: default
spec:
  nodeName: k4s-node-1
  # Always, for the same reason as the smoke pod: a reboot wipes the runtime
  # state, and the pod object outliving it is what makes "the network comes back
  # after a reboot" a thing this test can assert.
  restartPolicy: Always
  containers:
    - name: netns
      image: docker.io/library/busybox:1.36
      command:
        - "sh"
        - "-c"
        - "exec 2>>/out/result; echo K4S_NETNS_OK >> /out/result; ip addr show eth0 | grep 'inet ' >> /out/result; sleep 3600"
      volumeMounts:
        - name: out
          mountPath: /out
  volumes:
    - name: out
      hostPath:
        path: /var/log/k4s-netns
        type: DirectoryOrCreate
